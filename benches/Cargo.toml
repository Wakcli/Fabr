[package]
name = "benches"
edition = "2024"
description = "Benchmarks that test Eme's performance"
publish = false
license = "MIT OR Apache-2.0"
# Do not automatically discover benchmarks, we specify them manually instead.
autobenches = false

[dependencies]
# The primary crate that runs and analyzes our benchmarks. This is a regular dependency because the
# `bench!` macro refers to it in its documentation.
criterion = { version = "0.8.0", features = ["html_reports"] }
seq-macro = "0.3.6"

[dev-dependencies]
# Eme crates
eme_app = { path = "../crates/eme_app" }
eme_curve = { path = "../crates/eme_curve" }
eme_ecs = { path = "../crates/eme_ecs", features = ["multi_threaded"] }
eme_extract = { path = "../crates/eme_extract" }
eme_math = { path = "../crates/eme_math" }
eme_shape = { path = "../crates/eme_shape" }
eme_picking = { path = "../crates/eme_picking", features = ["mesh_picking"] }
eme_reflect = { path = "../crates/eme_reflect", features = ["functions"] }
eme_camera = { path = "../crates/eme_camera" }
eme_mesh = { path = "../crates/eme_mesh" }
eme_asset = { path = "../crates/eme_asset" }
eme_render = { path = "../crates/eme_render" }
eme_scene = { path = "../crates/eme_scene" }
eme_tasks = { path = "../crates/eme_tasks" }
eme_transform = { path = "../crates/eme_transform" }
eme_ui = { path = "../crates/eme_ui" }
eme_ui_widgets = { path = "../crates/eme_ui_widgets" }
eme_platform = { path = "../crates/eme_platform", default-features = false, features = [
  "std",
  "bytemuck",
] }

# Other crates
glam = { version = "0.33.2", default-features = false, features = [
  "std",
  "rand",
  "bytemuck",
] }
rand = "0.10"
chacha20 = { version = "0.10.0", default-features = false, features = ["rng"] }
nonmax = { version = "0.5", default-features = false }
bytemuck = { version = "1", default-features = false, features = [
  "derive",
  "must_cast",
] }

[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"

ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"

# see: https://github.com/bevyengine/eme/pull/15375#issuecomment-2366966219
too_long_first_doc_paragraph = "allow"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lib]
# This fixes the "Unrecognized Option" error when running commands like
# `cargo bench -- --save-baseline before` by disabling the default benchmark harness.
# See <https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options>
# for more information.
bench = false

[[bench]]
name = "ecs"
path = "benches/eme_ecs/main.rs"
harness = false

[[bench]]
name = "math"
path = "benches/eme_math/main.rs"
harness = false

[[bench]]
name = "picking"
path = "benches/eme_picking/main.rs"
harness = false

[[bench]]
name = "reflect"
path = "benches/eme_reflect/main.rs"
harness = false

[[bench]]
name = "render"
path = "benches/eme_render/main.rs"
harness = false

[[bench]]
name = "scene"
path = "benches/eme_scene/main.rs"
harness = false

[[bench]]
name = "tasks"
path = "benches/eme_tasks/main.rs"
harness = false

[[bench]]
name = "camera"
path = "benches/eme_camera/main.rs"
harness = false

[[bench]]
name = "transform"
path = "benches/eme_transform/main.rs"
harness = false

[[bench]]
name = "platform"
path = "benches/eme_platform/main.rs"
harness = false
