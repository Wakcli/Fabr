[package]
name = "bevy"
version = "0.20.0-dev"
edition = "2024"
description = "Emberrly Engine (Eme) compatibility facade - use bevy::prelude::*; re-exports eme"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
eme = { path = "../..", version = "0.20.0-dev", default-features = false }

