[package]
name = "eme_anim"
version = "0.20.0-dev"
edition = "2024"
description = "glTF animation playback shared by the Fabr editor and player"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["fabr", "animation", "gltf", "runtime"]
rust-version = "1.96.0"

[dependencies]
eme_app = { path = "../eme_app", version = "0.20.0-dev" }
eme_asset = { path = "../eme_asset", version = "0.20.0-dev" }
eme_animation = { path = "../eme_animation", version = "0.20.0-dev" }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev" }
eme_gltf = { path = "../eme_gltf", version = "0.20.0-dev", features = ["eme_animation"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
