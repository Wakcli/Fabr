[package]
name = "eme_animation"
version = "0.20.0-dev"
edition = "2024"
description = "Provides animation functionality for Eme Engine"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme"]

[dependencies]
# eme
eme_animation_macros = { path = "macros", version = "0.20.0-dev" }
eme_app = { path = "../eme_app", version = "0.20.0-dev" }
eme_asset = { path = "../eme_asset", version = "0.20.0-dev" }
eme_color = { path = "../eme_color", version = "0.20.0-dev" }
eme_curve = { path = "../eme_curve", version = "0.20.0-dev", features = [
  "eme_reflect",
] }
eme_derive = { path = "../eme_derive", version = "0.20.0-dev" }
eme_math = { path = "../eme_math", version = "0.20.0-dev" }
eme_mesh = { path = "../eme_mesh", version = "0.20.0-dev", optional = true, features = [
  "morph",
] }
eme_reflect = { path = "../eme_reflect", version = "0.20.0-dev", features = [
  "petgraph",
] }
eme_time = { path = "../eme_time", version = "0.20.0-dev" }
eme_utils = { path = "../eme_utils", version = "0.20.0-dev" }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev" }
eme_transform = { path = "../eme_transform", version = "0.20.0-dev" }
eme_platform = { path = "../eme_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
  "serialize",
] }

# other
petgraph = { version = "0.8", features = ["serde-1"] }
ron = "0.12"
serde = "1"
blake3 = { version = "1.0" }
downcast-rs = { version = "2", default-features = false, features = ["std"] }
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = ["from"] }
either = "1.13"
thread_local = "1"
uuid = { version = "1.21.0", features = ["v4"] }
smallvec = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
bitvec = { version = "1" }

[dev-dependencies]
itertools = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# TODO: Assuming all wasm builds are for the browser. Require `no_std` support to break assumption.
uuid = { version = "1.21.0", default-features = false, features = ["js"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
