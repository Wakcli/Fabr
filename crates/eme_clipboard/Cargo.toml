[package]
name = "eme_clipboard"
version = "0.20.0-dev"
edition = "2024"
description = "Provides clipboard support for Eme Engine"
homepage = "https://bevyengine.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme", "clipboard"]

[features]
default = []
system_clipboard = ["dep:arboard"]
image = [
  "system_clipboard",
  "dep:eme_asset",
  "dep:eme_image",
  "dep:wgpu-types",
  "arboard/image-data",
]
wayland = ["arboard?/wayland-data-control"]

[dependencies]
# eme
eme_app = { path = "../eme_app", version = "0.20.0-dev", default-features = false }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev", default-features = false }
eme_log = { path = "../eme_log", version = "0.20.0-dev", default-features = false }
eme_platform = { path = "../eme_platform", version = "0.20.0-dev", default-features = false }

[target.'cfg(any(windows, unix))'.dependencies]
eme_asset = { path = "../eme_asset", version = "0.20.0-dev", default-features = false, optional = true }
eme_image = { path = "../eme_image", version = "0.20.0-dev", default-features = false, optional = true }
wgpu-types = { version = "30", default-features = false, optional = true }
arboard = { version = "3.6.1", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2" }
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard"] }
wasm-bindgen-futures = "0.4"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition"]
all-features = true
