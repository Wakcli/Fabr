[package]
description = "Provides curve functionality for Eme Engine"
edition = "2024"
homepage = "https://eme.org"
keywords = ["eme"]
license = "MIT OR Apache-2.0"
name = "eme_curve"
repository = "https://github.com/bevyengine/eme"
rust-version = "1.94.0"
version = "0.20.0-dev"

[dependencies]
eme_math = { path = "../eme_math", version = "0.20.0-dev", default-features = false, features = [
  "approx",
] }
eme_reflect = { path = "../eme_reflect", version = "0.20.0-dev", default-features = false, optional = true }

itertools = { version = "0.15.0", default-features = false }
thiserror = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }
approx = { version = "0.5", default-features = false, optional = true }
variadics_please = "2.0"

[dev-dependencies]
approx = "0.5"
# Enable the approx feature when testing.
eme_math = { path = "../eme_math", version = "0.20.0-dev", default-features = false, features = [
  "approx",
] }

[features]
alloc = ["itertools/use_alloc", "serde?/alloc"]
default = ["std"]
std = [
  "alloc",
  "approx?/std",
  "eme_math/std",
  "eme_reflect?/std",
  "itertools/use_std",
  "serde?/std",
]

serialize = ["eme_math/serialize", "dep:serde"]
# Enable approx for eme_math types to approximate floating point equality comparisons and assertions
approx = ["eme_math/approx", "dep:approx"]
# Enable eme_reflect (requires alloc)
eme_reflect = ["alloc", "eme_math/eme_reflect", "dep:eme_reflect"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
  "--generate-link-to-definition",
  "--generate-macro-expansion",
  "-Zunstable-options",
]
