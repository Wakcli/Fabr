[package]
name = "eme_diagnostic"
version = "0.20.0-dev"
edition = "2024"
description = "Provides diagnostic functionality for Eme Engine"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme"]

[features]
default = ["std", "eme_ecs/default"]

# Functionality

## Adds serialization support through `serde`.
serialize = [
  "dep:serde",
  "eme_ecs/serialize",
  "eme_time/serialize",
  "eme_platform/serialize",
]

## Disables diagnostics that are unsupported when Eme is dynamically linked
dynamic_linking = []

## Adds integration with `sysinfo`.
sysinfo_plugin = ["sysinfo"]

# Platform Compatibility

## Allows access to the `std` crate. Enabling this feature will prevent compilation
## on `no_std` targets, but provides access to certain additional features on
## supported platforms.
std = [
  "serde?/std",
  "eme_ecs/std",
  "eme_app/std",
  "eme_platform/std",
  "eme_time/std",
]

## `critical-section` provides the building blocks for synchronization primitives
## on all platforms, including `no_std`.
critical-section = [
  "eme_ecs/critical-section",
  "eme_app/critical-section",
  "eme_platform/critical-section",
  "eme_time/critical-section",
]

[dependencies]
# eme
eme_app = { path = "../eme_app", version = "0.20.0-dev", default-features = false }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev", default-features = false }
eme_time = { path = "../eme_time", version = "0.20.0-dev", default-features = false }
eme_tasks = { path = "../eme_tasks", version = "0.20.0-dev", default-features = false }
eme_platform = { path = "../eme_platform", version = "0.20.0-dev", default-features = false, features = [
  "alloc",
] }

# other
atomic-waker = { version = "1", default-features = false }
const-fnv1a-hash = "1.1.0"
serde = { version = "1.0", default-features = false, features = [
  "alloc",
], optional = true }
log = { version = "0.4", default-features = false }

# macOS
[target.'cfg(all(target_os="macos"))'.dependencies]
# Some features of sysinfo are not supported by apple. This will disable those features on apple devices
sysinfo = { version = "0.39.5", optional = true, default-features = false, features = [
  "apple-app-store",
  "system",
] }

# Only include when on linux/windows/android/freebsd/netbsd
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "android", target_os = "freebsd", target_os = "netbsd"))'.dependencies]
sysinfo = { version = "0.39.5", optional = true, default-features = false, features = [
  "system",
] }

[dev-dependencies]
serde_test = "1.0"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
