[package]
name = "eme_dylib"
version = "0.20.0-dev"
edition = "2024"
description = "Force the Eme Engine to be dynamically linked for faster linking"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme"]

[lib]
crate-type = ["dylib"]

[dependencies]
eme_internal = { path = "../eme_internal", version = "0.20.0-dev", default-features = false }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
