[package]
name = "eme_editor_doc"
version = "0.20.0-dev"
edition = "2024"
description = "Scene document state for the Eme editor: hierarchy, undoable edits, save/load, and play mode"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme", "editor"]
rust-version = "1.96.0"

[dependencies]
eme_app = { path = "../eme_app", version = "0.20.0-dev" }
eme_asset = { path = "../eme_asset", version = "0.20.0-dev" }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev" }
eme_editor_core = { path = "../eme_editor_core", version = "0.20.0-dev" }
eme_math = { path = "../eme_math", version = "0.20.0-dev", default-features = false, features = [
  "std",
  "eme_reflect",
] }
eme_reflect = { path = "../eme_reflect", version = "0.20.0-dev" }
eme_scene = { path = "../eme_scene", version = "0.20.0-dev" }
eme_transform = { path = "../eme_transform", version = "0.20.0-dev" }
eme_world_serialization = { path = "../eme_world_serialization", version = "0.20.0-dev" }
ron = "0.12"
serde = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
