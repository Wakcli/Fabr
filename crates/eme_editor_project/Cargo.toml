[package]
name = "eme_editor_project"
version = "0.20.0-dev"
edition = "2024"
description = "On-disk editor project format, project creation, and persisted user state"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme", "editor"]
rust-version = "1.96.0"

[dependencies]
eme_editor_core = { path = "../eme_editor_core", version = "0.20.0-dev" }
ron = "0.12"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
