[package]
name = "eme_encase_derive"
version = "0.20.0-dev"
edition = "2024"
description = "Eme derive macro for encase"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme"]

[lib]
proc-macro = true

[dependencies]
eme_macro_utils = { path = "../eme_macro_utils", version = "0.20.0-dev" }
encase_derive_impl = "0.12"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
