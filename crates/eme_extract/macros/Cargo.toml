[package]
name = "eme_extract_macros"
version = "0.20.0-dev"
edition = "2024"
description = "Derive implementations for eme_extract"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme"]

[lib]
proc-macro = true

[dependencies]
eme_macro_utils = { path = "../../eme_macro_utils", version = "0.20.0-dev" }

syn = { version = "2.0", features = ["full"] }
proc-macro2 = "1.0"
quote = "1.0"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition"]
all-features = true
