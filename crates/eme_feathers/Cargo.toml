[package]
name = "eme_feathers"
version = "0.20.0-dev"
edition = "2024"
description = "A collection of UI widgets for building editors and utilities in Eme"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme"]

[dependencies]
# eme
eme_a11y = { path = "../eme_a11y", version = "0.20.0-dev" }
eme_app = { path = "../eme_app", version = "0.20.0-dev" }
eme_asset = { path = "../eme_asset", version = "0.20.0-dev" }
eme_camera = { path = "../eme_camera", version = "0.20.0-dev" }
eme_color = { path = "../eme_color", version = "0.20.0-dev" }
eme_ui_widgets = { path = "../eme_ui_widgets", version = "0.20.0-dev" }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev" }
eme_input = { path = "../eme_input", version = "0.20.0-dev" }
eme_input_focus = { path = "../eme_input_focus", version = "0.20.0-dev", features = [
  "eme_picking",
] }
eme_log = { path = "../eme_log", version = "0.20.0-dev" }
eme_math = { path = "../eme_math", version = "0.20.0-dev" }
eme_picking = { path = "../eme_picking", version = "0.20.0-dev", features = [
  "custom_cursor",
] }
eme_shader = { path = "../eme_shader", version = "0.20.0-dev" }
eme_platform = { path = "../eme_platform", version = "0.20.0-dev" }
eme_reflect = { path = "../eme_reflect", version = "0.20.0-dev" }
eme_render = { path = "../eme_render", version = "0.20.0-dev" }
eme_scene = { path = "../eme_scene", version = "0.20.0-dev" }
eme_text = { path = "../eme_text", version = "0.20.0-dev" }
eme_ui = { path = "../eme_ui", version = "0.20.0-dev", features = [
  "eme_picking",
] }
eme_ui_render = { path = "../eme_ui_render", version = "0.20.0-dev" }
eme_window = { path = "../eme_window", version = "0.20.0-dev" }
eme_derive = { path = "../eme_derive", version = "0.20.0-dev" }
smol_str = { version = "0.2", default-features = false }

# other
accesskit = "0.24"

[features]
default = []
webgl = []
webgpu = []

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
