[package]
name = "eme_game_scene"
version = "0.20.0-dev"
edition = "2024"
description = "Runtime-safe scene document for Emberrly games: objects, transforms, and RON round-trips"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme", "scene", "serialization"]
rust-version = "1.96.0"

[dependencies]
ron = "0.12"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
