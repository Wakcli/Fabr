[package]
name = "eme_gilrs"
version = "0.20.0-dev"
edition = "2024"
description = "Gamepad system made using Gilrs for Eme Engine"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme"]

[dependencies]
# eme
eme_app = { path = "../eme_app", version = "0.20.0-dev" }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev" }
eme_input = { path = "../eme_input", version = "0.20.0-dev", features = [
  "gamepad",
] }
eme_time = { path = "../eme_time", version = "0.20.0-dev" }
eme_platform = { path = "../eme_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
] }

# other
gilrs = "0.11.0"
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
