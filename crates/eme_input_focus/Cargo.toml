[package]
name = "eme_input_focus"
version = "0.20.0-dev"
edition = "2024"
description = "Keyboard focus management"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme"]
rust-version = "1.94.0"

[features]
default = [
  "std",
  "eme_reflect",
  "eme_ecs/async_executor",
  "gamepad",
  "keyboard",
  "mouse",
]
gamepad = ["eme_input/gamepad"]
keyboard = ["eme_input/keyboard"]
mouse = ["eme_input/mouse"]

# Functionality

## Adds runtime reflection support using `eme_reflect`.
eme_reflect = [
  "dep:eme_reflect",
  "eme_app/eme_reflect",
  "eme_ecs/eme_reflect",
  "eme_math/eme_reflect",
  "eme_input/eme_reflect",
  "eme_window/eme_reflect",
]

## Adds serialization support through `serde`.
serialize = [
  "eme_ecs/serialize",
  "eme_math/serialize",
  "eme_input/serialize",
  "eme_window/serialize",
]

# Platform Compatibility

## Allows access to the `std` crate. Enabling this feature will prevent compilation
## on `no_std` targets, but provides access to certain additional features on
## supported platforms.
std = [
  "eme_app/std",
  "eme_ecs/std",
  "eme_math/std",
  "eme_reflect/std",
  "eme_input/std",
  "eme_window/std",
]

## `critical-section` provides the building blocks for synchronization primitives
## on all platforms, including `no_std`.
critical-section = [
  "eme_app/critical-section",
  "eme_ecs/critical-section",
  "eme_reflect?/critical-section",
  "eme_input/critical-section",
]

## Uses the `libm` maths library instead of the one provided in `std` and `core`.
libm = ["eme_math/libm", "eme_window/libm"]

[dependencies]
# eme
eme_app = { path = "../eme_app", version = "0.20.0-dev", default-features = false }
eme_camera = { path = "../eme_camera", version = "0.20.0-dev", default-features = false }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev", default-features = false }
eme_input = { path = "../eme_input", version = "0.20.0-dev", default-features = false }
eme_math = { path = "../eme_math", version = "0.20.0-dev", default-features = false }
eme_picking = { path = "../eme_picking", version = "0.20.0-dev", default-features = false, optional = true }
eme_window = { path = "../eme_window", version = "0.20.0-dev", default-features = false }
eme_reflect = { path = "../eme_reflect", version = "0.20.0-dev", features = [
  "glam",
], default-features = false, optional = true }

# other
thiserror = { version = "2", default-features = false }
log = { version = "0.4", default-features = false }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
