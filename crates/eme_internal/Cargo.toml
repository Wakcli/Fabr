[package]
name = "eme_internal"
version = "0.20.0-dev"
edition = "2024"
description = "An internal Eme crate used to facilitate optional dynamic linking via the 'dynamic_linking' feature"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["game", "engine", "gamedev", "graphics", "eme"]
categories = ["game-engines", "graphics", "gui", "rendering"]

[features]
trace = [
  "eme_anti_alias?/trace",
  "eme_app/trace",
  "eme_asset?/trace",
  "eme_core_pipeline?/trace",
  "eme_ecs/trace",
  "eme_extract/trace",
  "eme_log/trace",
  "eme_pbr?/trace",
  "eme_post_process?/trace",
  "eme_render?/trace",
  "eme_transform/trace",
  "eme_winit?/trace",
]
trace_chrome = ["eme_log/tracing-chrome"]
trace_tracy = ["eme_render?/tracing-tracy", "eme_log/tracing-tracy"]
trace_tracy_memory = ["eme_log/trace_tracy_memory", "trace", "trace_tracy"]
detailed_trace = ["eme_ecs/detailed_trace", "eme_render?/detailed_trace"]

sysinfo_plugin = ["eme_diagnostic/sysinfo_plugin"]

# Texture compression asset processor (cross-platform, transcodes to any GPU format at load time)
compressed_image_saver_universal = [
  "eme_image/compressed_image_saver_universal",
]

# Texture compression asset processor (BCn for desktop, ASTC for mobile via env var)
compressed_image_saver = ["eme_image/compressed_image_saver"]

# For ktx2 supercompression
zlib = ["eme_image/zlib"]
zstd = ["eme_image/zstd"]
zstd_rust = ["eme_image/zstd_rust"]
zstd_c = ["eme_image/zstd_c"]

# Image format support (HDR and PNG enabled by default)
basis-universal = ["eme_image/basis-universal"]
bmp = ["eme_image/bmp"]
ff = ["eme_image/ff"]
gif = ["eme_image/gif"]
ico = ["eme_image/ico"]
jpeg = ["eme_image/jpeg"]
png = ["eme_image/png"]
pnm = ["eme_image/pnm"]
qoi = ["eme_image/qoi"]
tga = ["eme_image/tga"]
tiff = ["eme_image/tiff"]
webp = ["eme_image/webp"]
dds = ["eme_image/dds"]
exr = ["eme_image/exr"]
hdr = ["eme_image/hdr"]
ktx2 = ["eme_image/ktx2"]

# Enable SPIR-V passthrough
spirv_shader_passthrough = ["eme_render/spirv_shader_passthrough"]

# Statically linked DXC shader compiler for DirectX 12
# TODO: When wgpu switches to DirectX 12 instead of Vulkan by default on windows, make this a default feature
statically-linked-dxc = ["eme_render/statically-linked-dxc"]

# Forces the wgpu instance to be initialized using the raw Vulkan HAL, enabling additional configuration
raw_vulkan_init = ["eme_render/raw_vulkan_init"]

# Pre-populate buffer labels with buffer types for debugging.
type_label_buffers = ["eme_render/type_label_buffers"]

# Include tonemapping LUT KTX2 files.
tonemapping_luts = [
  "eme_core_pipeline?/tonemapping_luts",
  "ktx2",
  "eme_image/zstd",
]

# Include SMAA LUT KTX2 Files
smaa_luts = ["eme_anti_alias?/smaa_luts", "ktx2", "eme_image/zstd"]

# Include Bluenoise texture for environment map generation.
bluenoise_texture = ["eme_pbr?/bluenoise_texture", "ktx2", "eme_image/zstd"]

# Include a preintegrated BRDF Look Up Table for more accurate specular shading.
dfg_lut = ["eme_pbr?/dfg_lut", "ktx2", "eme_image/zstd"]

# Include Look Up Tables that are required for area lights.
area_light_luts = ["eme_pbr?/area_light_luts", "ktx2", "eme_image/zstd"]

# NVIDIA Deep Learning Super Sampling
dlss = ["eme_anti_alias/dlss", "eme_solari?/dlss"]

# Forcibly disable DLSS so that `cargo build --all-features` works without the DLSS SDK being installed. Not meant for users.
force_disable_dlss = [
  "eme_anti_alias?/force_disable_dlss",
  "eme_solari?/force_disable_dlss",
]

# Audio format support (vorbis is enabled by default)
flac = ["eme_audio/flac"]
mp3 = ["eme_audio/mp3"]
mp4 = ["eme_audio/mp4"]
vorbis = ["eme_audio/vorbis"]
wav = ["eme_audio/wav"]
aac = ["eme_audio/aac"]
symphonia-flac = ["eme_audio/symphonia-flac"]
symphonia-vorbis = ["eme_audio/symphonia-vorbis"]
symphonia-wav = ["eme_audio/symphonia-wav"]

# Shader formats
shader_format_spirv = ["eme_render?/shader_format_spirv"]

serialize = [
  "eme_a11y?/serialize",
  "eme_color?/serialize",
  "eme_dev_tools?/serialize",
  "eme_ecs/serialize",
  "eme_image?/serialize",
  "eme_input/serialize",
  "eme_math/serialize",
  "eme_shape/serialize",
  "eme_curve?/serialize",
  "eme_world_serialization?/serialize",
  "eme_time/serialize",
  "eme_transform/serialize",
  "eme_ui?/serialize",
  "eme_utils/serialize",
  "eme_window?/serialize",
  "eme_winit?/serialize",
  "eme_platform/serialize",
  "eme_render?/serialize",
]
multi_threaded = [
  "std",
  "eme_asset?/multi_threaded",
  "eme_ecs/multi_threaded",
  "eme_render?/multi_threaded",
  "eme_tasks/multi_threaded",
  "eme_transform/multi_threaded",
]
async-io = ["std", "eme_tasks/async-io"]

# Display server protocol support (X11 is enabled by default)
wayland = ["eme_winit/wayland", "eme_clipboard?/wayland"]
x11 = ["eme_winit/x11"]

# Android activity support (choose one)
android-native-activity = ["eme_winit/android-native-activity"]
android-game-activity = ["eme_winit/android-game-activity"]

# Transmission textures in `StandardMaterial`:
pbr_transmission_textures = [
  "eme_pbr?/pbr_transmission_textures",
  "eme_gltf?/pbr_transmission_textures",
]

# Clustered Decal support
pbr_clustered_decals = ["eme_pbr?/pbr_clustered_decals"]

# Light Texture support
pbr_light_textures = [
  "eme_pbr?/pbr_clustered_decals",
  "eme_pbr?/pbr_light_textures",
]

# Multi-layer material textures in `StandardMaterial`:
pbr_multi_layer_material_textures = [
  "eme_pbr?/pbr_multi_layer_material_textures",
  "eme_gltf?/pbr_multi_layer_material_textures",
]

# Anisotropy texture in `StandardMaterial`:
pbr_anisotropy_texture = [
  "eme_pbr?/pbr_anisotropy_texture",
  "eme_gltf?/pbr_anisotropy_texture",
]

# Percentage-closer soft shadows
experimental_pbr_pcss = ["eme_pbr?/experimental_pbr_pcss"]

# Specular textures in `StandardMaterial`:
pbr_specular_textures = [
  "eme_pbr?/pbr_specular_textures",
  "eme_gltf?/pbr_specular_textures",
]

# Optimise for WebGL2
webgl = [
  "eme_core_pipeline?/webgl",
  "eme_anti_alias?/webgl",
  "eme_pbr?/webgl",
  "eme_render?/webgl",
  "eme_gizmos_render?/webgl",
  "eme_sprite_render?/webgl",
  "eme_dev_tools?/webgl",
  "eme_post_process?/webgl",
  "eme_feathers?/webgl",
]

webgpu = [
  "eme_core_pipeline?/webgpu",
  "eme_anti_alias?/webgpu",
  "eme_pbr?/webgpu",
  "eme_render?/webgpu",
  "eme_gizmos_render?/webgpu",
  "eme_sprite_render?/webgpu",
  "eme_dev_tools?/webgpu",
  "eme_post_process?/webgpu",
  "eme_feathers?/webgpu",
]

# Enable systems that allow for automated testing on CI
eme_ci_testing = ["eme_dev_tools/eme_ci_testing", "eme_render?/ci_limits"]

render_dev_tools = ["eme_dev_tools/render"]

# Enable glTF animation loading
gltf_animation = ["eme_animation", "eme_gltf?/eme_animation"]

# Enables support for morph target weights in eme_mesh
morph = ["eme_mesh?/morph", "eme_render?/morph"]

# Enables eme_mesh and eme_animation morph weight support
morph_animation = ["morph", "eme_animation?/eme_mesh"]

eme_extract = ["dep:eme_extract"]
eme_curve = ["dep:eme_curve"]
eme_shader = ["dep:eme_shader"]
eme_image = ["dep:eme_image", "eme_color", "eme_asset"]
eme_sprite = ["dep:eme_sprite", "eme_camera"]
eme_text = [
  "dep:eme_text",
  "eme_image",
  "eme_sprite?/eme_text",
  "eme_sprite_render?/eme_text",
]
eme_ui = ["dep:eme_ui", "eme_text", "eme_sprite"]
eme_mesh = ["dep:eme_mesh", "eme_image", "eme_gizmos?/eme_mesh"]
eme_animation = ["dep:eme_animation", "eme_mesh"]
eme_mikktspace = ["eme_mesh?/eme_mikktspace"]
eme_window = ["dep:eme_window", "dep:eme_a11y", "eme_image"]
eme_winit = ["dep:eme_winit", "eme_window"]
eme_camera = ["dep:eme_camera", "eme_mesh", "eme_window"]
eme_world_serialization = ["dep:eme_world_serialization", "eme_asset"]
eme_material = ["dep:eme_material", "eme_image", "eme_shader"]
eme_light = ["dep:eme_light", "eme_camera"]
eme_render = [
  "dep:eme_render",
  "eme_camera",
  "eme_extract",
  "eme_shader",
  "eme_color/wgpu-types",
  "eme_color/encase",
]
eme_core_pipeline = ["dep:eme_core_pipeline", "eme_render"]
eme_anti_alias = ["dep:eme_anti_alias", "eme_core_pipeline"]
eme_post_process = ["dep:eme_post_process", "eme_core_pipeline"]
eme_pbr = [
  "dep:eme_pbr",
  "eme_light",
  "eme_material",
  "eme_core_pipeline",
  "eme_gizmos_render?/eme_pbr",
]
eme_sprite_render = [
  "dep:eme_sprite_render",
  "eme_sprite",
  "eme_material",
  "eme_core_pipeline",
  "eme_gizmos_render?/eme_sprite_render",
]
eme_ui_render = ["dep:eme_ui_render", "eme_sprite_render", "eme_ui"]
# Feathers ships its built-in icons as PNGs, so enable the PNG feature
eme_feathers = ["dep:eme_feathers", "png"]
eme_solari = ["dep:eme_solari", "eme_pbr"]
eme_gizmos = ["dep:eme_gizmos", "eme_camera", "eme_light?/eme_gizmos"]
eme_gizmos_render = ["dep:eme_gizmos_render", "eme_gizmos"]
eme_gltf = ["dep:eme_gltf", "eme_world_serialization", "eme_pbr?/eme_gltf"]

# Used to disable code that is unsupported when Eme is dynamically linked
dynamic_linking = ["eme_diagnostic/dynamic_linking"]

# Enable AccessKit on Unix backends (currently only works with experimental
# screen readers and forks.)
accesskit_unix = ["eme_winit/accesskit_unix"]

# Enable assertions to check the validity of parameters passed to glam
glam_assert = ["eme_math/glam_assert"]

# Enable assertions in debug builds to check the validity of parameters passed to glam
debug_glam_assert = ["eme_math/debug_glam_assert"]

# Include a default font, containing only ASCII characters, at the cost of a 20kB binary size increase
default_font = ["eme_text?/default_font"]

# Allows for discovery of preloaded system fonts
system_font_discovery = ["eme_text?/system_font_discovery"]

# Enables dictionary-based segmentation for complex scripts (CJK, Thai, Khmer, Lao, Myanmar), at the cost of a larger binary
complex_script_segmentation = ["eme_text?/complex_script_segmentation"]

# Enables downloading assets from HTTP sources
http = ["eme_asset?/http"]

# Enables downloading assets from HTTPS sources
https = ["eme_asset?/https"]

# Enable caching downloaded assets on the filesystem. NOTE: this cache currently never invalidates entries!
web_asset_cache = ["eme_asset?/web_asset_cache"]

# Enables the built-in asset processor for processed assets.
asset_processor = ["eme_asset?/asset_processor"]

# Enables watching the filesystem for Eme Asset hot-reloading
file_watcher = ["eme_asset?/file_watcher"]

# Enables watching embedded files for Eme Asset hot-reloading
embedded_watcher = ["eme_asset?/embedded_watcher"]

# Enable system stepping support
eme_debug_stepping = [
  "eme_ecs/eme_debug_stepping",
  "eme_app/eme_debug_stepping",
]

# Enables the meshlet renderer for dense high-poly scenes (experimental)
meshlet = ["eme_pbr?/meshlet"]

# Enables processing meshes into meshlet meshes for eme_pbr
meshlet_processor = ["eme_pbr?/meshlet_processor"]

# Provides a collection of developer tools
eme_dev_tools = ["dep:eme_dev_tools"]

# Provides a collection of prebuilt camera controllers
eme_camera_controller = ["dep:eme_camera_controller"]
free_camera = ["eme_camera_controller/free_camera"]
pan_camera = ["eme_camera_controller/pan_camera"]
pan_orbit_camera = [
  "eme_camera_controller/pan_orbit_camera",
  "eme_camera_controller/extension_anchor_indicator",
  "eme_camera_controller/extension_independent_skybox",
]

# Enable support for the Eme Remote Protocol
eme_remote = ["dep:eme_remote", "serialize"]

# Provides picking functionality without any backend
eme_picking = ["dep:eme_picking"]

# Provides a mesh picking backend
mesh_picking = ["eme_picking", "eme_picking/mesh_picking"]

# Provides a sprite picking backend
sprite_picking = ["eme_picking", "eme_sprite?/eme_picking"]

# Provides a UI picking backend
ui_picking = [
  "eme_picking",
  "eme_ui?/eme_picking",
  "eme_input_focus?/eme_picking",
]

# Provides a UI debug overlay
eme_ui_debug = ["eme_ui_render?/eme_ui_debug"]

# Enable built in global state machines
eme_state = ["dep:eme_state"]

# Enables source location tracking for change detection, which can assist with debugging
track_location = ["eme_ecs/track_location"]

# Enable function reflection
reflect_functions = [
  "eme_reflect/functions",
  "eme_app/reflect_functions",
  "eme_ecs/reflect_functions",
  "eme_render?/reflect_functions",
]

# Enable automatic reflect registration using inventory.
reflect_auto_register = [
  "eme_reflect/auto_register_inventory",
  "eme_app/reflect_auto_register",
  "eme_ecs/reflect_auto_register",
  "eme_render?/reflect_auto_register",
]

# Enable automatic reflect registration without inventory. See `reflect::load_type_registrations` for more info.
reflect_auto_register_static = [
  "eme_reflect/auto_register_static",
  "eme_app/reflect_auto_register",
  "eme_ecs/reflect_auto_register",
  "eme_render?/reflect_auto_register",
]

# Enables eme_reflect to access documentation comments of Rust code at runtime
reflect_documentation = ["eme_reflect/reflect_documentation"]

# Enable custom cursor support
custom_cursor = [
  "eme_window/custom_cursor",
  "eme_winit/custom_cursor",
  "eme_picking/custom_cursor",
]

# Experimental support for nodes that are ignored for UI layouting
ghost_nodes = ["eme_ui/ghost_nodes"]

# Allows access to the `std` crate. Enabling this feature will prevent compilation
# on `no_std` targets, but provides access to certain additional features on
# supported platforms.
std = [
  "eme_a11y?/std",
  "eme_app/std",
  "eme_color?/std",
  "eme_diagnostic/std",
  "eme_ecs/std",
  "eme_input/std",
  "eme_input_focus?/std",
  "eme_math/std",
  "eme_shape/std",
  "eme_curve?/std",
  "eme_platform/std",
  "eme_reflect/std",
  "eme_state?/std",
  "eme_time/std",
  "eme_transform/std",
  "eme_window?/std",
]

# `critical-section` provides the building blocks for synchronization primitives
# on all platforms, including `no_std`.
critical-section = [
  "eme_a11y?/critical-section",
  "eme_app/critical-section",
  "eme_diagnostic/critical-section",
  "eme_ecs/critical-section",
  "eme_input/critical-section",
  "eme_input_focus?/critical-section",
  "eme_platform/critical-section",
  "eme_reflect/critical-section",
  "eme_state?/critical-section",
  "eme_time/critical-section",
]

# Uses the `libm` maths library instead of the one provided in `std` and `core`.
libm = [
  "eme_color?/libm",
  "eme_input/libm",
  "eme_input_focus?/libm",
  "eme_math/libm",
  "eme_transform/libm",
  "eme_window?/libm",
]

# Uses `async-executor` as a task execution backend.
# This backend is incompatible with `no_std` targets.
async_executor = [
  "std",
  "eme_tasks/async_executor",
  "eme_ecs/async_executor",
  "eme_transform/async_executor",
]

# Enables use of browser APIs.
# Note this is currently only applicable on `wasm32` architectures.
web = ["eme_app/web", "eme_platform/web", "eme_reflect/web"]

# Input sources.
mouse = ["eme_input/mouse", "eme_input_focus?/mouse"]
keyboard = ["eme_input/keyboard", "eme_input_focus?/keyboard"]
gamepad = ["eme_input/gamepad", "eme_input_focus?/gamepad"]
touch = ["eme_input/touch"]
gestures = ["eme_input/gestures"]

# Clipboard support
eme_clipboard = ["dep:eme_clipboard"]
system_clipboard = [
  "dep:eme_clipboard",
  "eme_clipboard/system_clipboard",
  "eme_text?/system_clipboard",
]
clipboard_image = ["dep:eme_clipboard", "eme_clipboard/image"]

hotpatching = ["eme_app/hotpatching", "eme_ecs/hotpatching"]

debug = ["eme_utils/debug", "eme_ecs/debug", "eme_render?/debug"]

screenrecording = ["eme_dev_tools/screenrecording"]
schedule_data = ["eme_dev_tools/schedule_data"]

# Keep feature for eme-settings as eme_settings
eme_settings = ["eme-settings"]

[dependencies]
# eme (no_std)
eme_app = { path = "../eme_app", version = "0.20.0-dev", default-features = false, features = [
  "eme_reflect",
] }
eme_derive = { path = "../eme_derive", version = "0.20.0-dev", default-features = false }
eme_diagnostic = { path = "../eme_diagnostic", version = "0.20.0-dev", default-features = false }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev", default-features = false, features = [
  "eme_reflect",
] }
eme_input = { path = "../eme_input", version = "0.20.0-dev", default-features = false, features = [
  "eme_reflect",
] }
eme_math = { path = "../eme_math", version = "0.20.0-dev", default-features = false, features = [
  "eme_reflect",
  "nostd-libm",
] }
eme_shape = { path = "../eme_shape", version = "0.20.0-dev", default-features = false, features = [
  "eme_reflect",
] }
eme_platform = { path = "../eme_platform", version = "0.20.0-dev", default-features = false, features = [
  "alloc",
] }
eme_ptr = { path = "../eme_ptr", version = "0.20.0-dev", default-features = false }
eme_reflect = { path = "../eme_reflect", version = "0.20.0-dev", default-features = false, features = [
  "smallvec",
] }
eme_time = { path = "../eme_time", version = "0.20.0-dev", default-features = false, features = [
  "eme_reflect",
] }
eme_transform = { path = "../eme_transform", version = "0.20.0-dev", default-features = false, features = [
  "eme-support",
  "eme_reflect",
] }
eme_utils = { path = "../eme_utils", version = "0.20.0-dev", default-features = false }
eme_tasks = { path = "../eme_tasks", version = "0.20.0-dev", default-features = false }

# eme (std required)
eme_log = { path = "../eme_log", version = "0.20.0-dev", optional = true }

# eme (optional)
eme_a11y = { path = "../eme_a11y", optional = true, version = "0.20.0-dev", features = [
  "eme_reflect",
] }
eme_camera_controller = { path = "../eme_camera_controller", optional = true, version = "0.20.0-dev", default-features = false }
eme_curve = { path = "../eme_curve", optional = true, version = "0.20.0-dev", default-features = false, features = [
  "alloc",
  "eme_reflect",
] }
eme_animation = { path = "../eme_animation", optional = true, version = "0.20.0-dev" }
eme_asset = { path = "../eme_asset", optional = true, version = "0.20.0-dev" }
eme_audio = { path = "../eme_audio", optional = true, version = "0.20.0-dev" }
eme_color = { path = "../eme_color", optional = true, version = "0.20.0-dev", default-features = false, features = [
  "alloc",
  "eme_reflect",
] }
eme_core_pipeline = { path = "../eme_core_pipeline", optional = true, version = "0.20.0-dev" }
eme_post_process = { path = "../eme_post_process", optional = true, version = "0.20.0-dev" }
eme_ui_widgets = { path = "../eme_ui_widgets", optional = true, version = "0.20.0-dev" }
eme_anti_alias = { path = "../eme_anti_alias", optional = true, version = "0.20.0-dev" }
eme_dev_tools = { path = "../eme_dev_tools", optional = true, version = "0.20.0-dev" }
eme_extract = { path = "../eme_extract", optional = true, version = "0.20.0-dev" }
eme_gilrs = { path = "../eme_gilrs", optional = true, version = "0.20.0-dev" }
eme_gizmos = { path = "../eme_gizmos", optional = true, version = "0.20.0-dev", default-features = false }
eme_gizmos_render = { path = "../eme_gizmos_render", optional = true, version = "0.20.0-dev", default-features = false }
eme_gltf = { path = "../eme_gltf", optional = true, version = "0.20.0-dev" }
eme_feathers = { path = "../eme_feathers", optional = true, version = "0.20.0-dev" }
eme_image = { path = "../eme_image", optional = true, version = "0.20.0-dev" }
eme_shader = { path = "../eme_shader", optional = true, version = "0.20.0-dev" }
eme_material = { path = "../eme_material", optional = true, version = "0.20.0-dev" }
eme_mesh = { path = "../eme_mesh", optional = true, version = "0.20.0-dev" }
eme_camera = { path = "../eme_camera", optional = true, version = "0.20.0-dev" }
eme_light = { path = "../eme_light", optional = true, version = "0.20.0-dev" }
eme_input_focus = { path = "../eme_input_focus", optional = true, version = "0.20.0-dev", default-features = false, features = [
  "eme_reflect",
] }
eme_pbr = { path = "../eme_pbr", optional = true, version = "0.20.0-dev" }
eme_picking = { path = "../eme_picking", optional = true, version = "0.20.0-dev" }
eme-settings = { path = "../eme_settings", optional = true, version = "0.20.0-dev" }
eme_remote = { path = "../eme_remote", optional = true, version = "0.20.0-dev", default-features = false, features = [
  "eme_asset",
  "eme_render",
] }
eme_render = { path = "../eme_render", optional = true, version = "0.20.0-dev" }
eme_world_serialization = { path = "../eme_world_serialization", optional = true, version = "0.20.0-dev" }
eme_scene = { path = "../eme_scene", optional = true, version = "0.20.0-dev" }
eme_solari = { path = "../eme_solari", optional = true, version = "0.20.0-dev" }
eme_sprite = { path = "../eme_sprite", optional = true, version = "0.20.0-dev" }
eme_sprite_render = { path = "../eme_sprite_render", optional = true, version = "0.20.0-dev" }
eme_state = { path = "../eme_state", optional = true, version = "0.20.0-dev", default-features = false, features = [
  "eme_app",
  "eme_reflect",
] }
eme_text = { path = "../eme_text", optional = true, version = "0.20.0-dev" }
eme_ui = { path = "../eme_ui", optional = true, version = "0.20.0-dev" }
eme_ui_render = { path = "../eme_ui_render", optional = true, version = "0.20.0-dev" }
eme_window = { path = "../eme_window", optional = true, version = "0.20.0-dev", default-features = false, features = [
  "eme_reflect",
] }
eme_clipboard = { path = "../eme_clipboard", optional = true, version = "0.20.0-dev", default-features = false }
eme_winit = { path = "../eme_winit", optional = true, version = "0.20.0-dev", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
eme_android = { path = "../eme_android", version = "0.20.0-dev", default-features = false }

# Only enable eme_remote/http (default features) on non-WASM targets.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
eme_remote = { path = "../eme_remote", version = "0.20.0-dev", default-features = true, optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
