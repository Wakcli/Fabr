[package]
name = "eme_mesh"
version = "0.20.0-dev"
edition = "2024"
description = "Provides mesh types for Eme Engine"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme"]

[dependencies]
# eme
eme_app = { path = "../eme_app", version = "0.20.0-dev" }
eme_asset = { path = "../eme_asset", version = "0.20.0-dev" }
eme_encase_derive = { path = "../eme_encase_derive", version = "0.20.0-dev" }
eme_math = { path = "../eme_math", version = "0.20.0-dev" }
eme_shape = { path = "../eme_shape", version = "0.20.0-dev", features = [
  "eme_reflect",
] }
eme_reflect = { path = "../eme_reflect", version = "0.20.0-dev" }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev" }
eme_transform = { path = "../eme_transform", version = "0.20.0-dev" }
eme_mikktspace = { version = "1", package = "bevy_mikktspace", optional = true }
eme_derive = { path = "../eme_derive", version = "0.20.0-dev" }
eme_platform = { path = "../eme_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
  "serialize",
] }

# other
bitflags = { version = "2.3", features = ["serde"] }
bytemuck = { version = "1.5", features = ["must_cast"] }
wgpu-types = { version = "30", default-features = false }
serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }
hexasphere = "19.0"
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
derive_more = { version = "2", default-features = false, features = ["from"] }
half = { version = "2.4.1", features = ["bytemuck"] }
encase = "0.12"
glam = { version = "0.33.2", default-features = false, optional = true }

[dev-dependencies]
approx = "0.5"
serde_json = "1.0.140"

[features]
default = []
## Adds serialization support through `serde`.
serialize = ["dep:serde", "wgpu-types/serde", "half/serde"]
morph = ["glam/encase"]

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
