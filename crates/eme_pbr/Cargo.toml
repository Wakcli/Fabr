[package]
name = "eme_pbr"
version = "0.20.0-dev"
edition = "2024"
description = "Adds PBR rendering to Eme Engine"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme"]

[features]
webgl = ["eme_light/webgl"]
webgpu = ["eme_light/webgpu"]
pbr_transmission_textures = ["eme_gltf?/pbr_transmission_textures"]
pbr_multi_layer_material_textures = [
  "eme_gltf?/pbr_multi_layer_material_textures",
]
pbr_anisotropy_texture = ["eme_gltf?/pbr_anisotropy_texture"]
pbr_specular_textures = ["eme_gltf?/pbr_specular_textures"]
experimental_pbr_pcss = ["eme_light/experimental_pbr_pcss"]
pbr_clustered_decals = []
pbr_light_textures = []
bluenoise_texture = ["eme_image/ktx2", "eme_image/zstd"]
dfg_lut = ["eme_image/ktx2", "eme_image/zstd"]
area_light_luts = ["eme_image/ktx2", "eme_image/zstd"]
trace = ["eme_render/trace"]
# Enables the meshlet renderer for dense high-poly scenes (experimental)
meshlet = ["dep:lz4_flex", "dep:range-alloc"]
# Enables processing meshes into meshlet meshes
meshlet_processor = [
  "meshlet",
  "dep:meshopt",
  "dep:metis",
  "dep:itertools",
  "dep:bitvec",
]

[dependencies]
# eme
eme_app = { path = "../eme_app", version = "0.20.0-dev" }
eme_asset = { path = "../eme_asset", version = "0.20.0-dev" }
eme_color = { path = "../eme_color", version = "0.20.0-dev" }
eme_core_pipeline = { path = "../eme_core_pipeline", version = "0.20.0-dev" }
eme_derive = { path = "../eme_derive", version = "0.20.0-dev" }
eme_diagnostic = { path = "../eme_diagnostic", version = "0.20.0-dev" }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev" }
eme_extract = { path = "../eme_extract", version = "0.20.0-dev" }
eme_gltf = { path = "../eme_gltf", version = "0.20.0-dev", optional = true }
eme_light = { path = "../eme_light", version = "0.20.0-dev" }
eme_log = { path = "../eme_log", version = "0.20.0-dev" }
eme_image = { path = "../eme_image", version = "0.20.0-dev" }
eme_mesh = { path = "../eme_mesh", version = "0.20.0-dev", features = [
  "morph",
  "eme_mikktspace",
] }
eme_shader = { path = "../eme_shader", version = "0.20.0-dev" }
eme_material = { path = "../eme_material", version = "0.20.0-dev" }
eme_math = { path = "../eme_math", version = "0.20.0-dev" }
eme_shape = { path = "../eme_shape", version = "0.20.0-dev" }
eme_reflect = { path = "../eme_reflect", version = "0.20.0-dev" }
eme_render = { path = "../eme_render", version = "0.20.0-dev", features = [
  "morph",
] }
eme_camera = { path = "../eme_camera", version = "0.20.0-dev" }
eme_tasks = { path = "../eme_tasks", version = "0.20.0-dev" }
eme_transform = { path = "../eme_transform", version = "0.20.0-dev" }
eme_utils = { path = "../eme_utils", version = "0.20.0-dev" }
eme_platform = { path = "../eme_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
] }

# other
bitflags = { version = "2.3", features = ["bytemuck"] }
fixedbitset = "0.5"
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = ["from"] }
# meshlet
lz4_flex = { version = "0.13", default-features = false, features = [
  "frame",
], optional = true }
range-alloc = { version = "0.1", optional = true }
meshopt = { version = "0.6.2", optional = true }
metis = { version = "0.2.2", optional = true }
itertools = { version = "0.15", optional = true }
bitvec = { version = "1", optional = true }
# direct dependency required for derive macro
bytemuck = { version = "1", features = ["derive", "must_cast"] }
smallvec = { version = "1", default-features = false }
nonmax = "0.5"
static_assertions = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
offset-allocator = "0.2"
arrayvec = { version = "0.7", default-features = false }
indexmap = { version = "2" }
wgpu-types = "30"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
features = ["eme_image/zstd_rust"]
