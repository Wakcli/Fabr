[package]
name = "eme_ptr"
version = "0.20.0-dev"
edition = "2024"
description = "Utilities for working with untyped pointers in a more safe way"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme", "no_std"]
rust-version = "1.85.0"

[dependencies]

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
