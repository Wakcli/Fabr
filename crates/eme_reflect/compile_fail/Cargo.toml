[package]
name = "eme_reflect_compile_fail"
edition = "2024"
description = "Compile fail tests for Eme Engine's reflection system"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
eme_reflect = { path = "../", features = ["functions"] }

[dev-dependencies]
compile_fail_utils = { path = "../../../tools/compile_fail_utils" }

[[test]]
name = "derive"
harness = false

[[test]]
name = "func"
harness = false

[[test]]
name = "remote"
harness = false
