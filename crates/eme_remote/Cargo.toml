[package]
name = "eme_remote"
version = "0.20.0-dev"
edition = "2024"
description = "The Eme Remote Protocol"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme"]

[features]
default = ["http", "eme_asset", "eme_render"]
http = [
  "dep:async-io",
  "dep:hyper",
  "dep:smol-hyper",
  "dep:http-body-util",
  "eme_tasks/async-io",
]
eme_asset = ["dep:eme_asset"]
eme_render = ["dep:eme_render", "eme_dev_tools/render"]

[dependencies]
# eme
eme_app = { path = "../eme_app", version = "0.20.0-dev" }
eme_color = { path = "../eme_color", version = "0.20.0-dev" }
eme_derive = { path = "../eme_derive", version = "0.20.0-dev" }
eme_dev_tools = { path = "../eme_dev_tools", version = "0.20.0-dev", features = [
  "schedule_data",
] }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev", features = [
  "serialize",
] }
eme_reflect = { path = "../eme_reflect", version = "0.20.0-dev" }
eme_render = { path = "../eme_render", version = "0.20.0-dev", optional = true }
eme_tasks = { path = "../eme_tasks", version = "0.20.0-dev" }
eme_utils = { path = "../eme_utils", version = "0.20.0-dev", features = [
  "debug",
] }
eme_platform = { path = "../eme_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
  "serialize",
] }
eme_asset = { path = "../eme_asset", version = "0.20.0-dev", optional = true }
eme_log = { path = "../eme_log", version = "0.20.0-dev" }

# other
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
async-channel = "2"

# dependencies that will not compile on wasm
[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-io = { version = "2", optional = true }
hyper = { version = "1", optional = true, features = ["server", "http1"] }
smol-hyper = { version = "0.1", optional = true }
http-body-util = { version = "0.1", optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options", "--cfg", "docsrs"]
all-features = true
