[package]
name = "eme_scene"
version = "0.20.0-dev"
edition = "2024"
description = "Provides scene functionality for Eme Engine"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme"]

[dependencies]
eme_scene_macros = { path = "macros", version = "0.20.0-dev" }

eme_app = { path = "../eme_app", version = "0.20.0-dev" }
eme_asset = { path = "../eme_asset", version = "0.20.0-dev" }
eme_derive = { path = "../eme_derive", version = "0.20.0-dev" }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev" }
eme_log = { path = "../eme_log", version = "0.20.0-dev" }
eme_platform = { path = "../eme_platform", version = "0.20.0-dev" }
eme_reflect = { path = "../eme_reflect", version = "0.20.0-dev" }
eme_utils = { path = "../eme_utils", version = "0.20.0-dev" }

smallvec = { version = "1", default-features = false }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
variadics_please = "2.0"

[lints]
workspace = true
