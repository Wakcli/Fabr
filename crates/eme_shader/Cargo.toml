[package]
name = "eme_shader"
version = "0.20.0-dev"
edition = "2024"
description = "Provides shader asset types and import resolution for Eme"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme", "shader"]

[dependencies]
# eme
eme_asset = { path = "../eme_asset", version = "0.20.0-dev" }
eme_reflect = { path = "../eme_reflect", version = "0.20.0-dev" }
eme_platform = { path = "../eme_platform", version = "0.20.0-dev" }
eme_utils = { path = "../eme_utils", version = "0.20.0-dev" }

# other
wgpu-types = { version = "30", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = { version = "2", default-features = false }
wesl = { version = "0.4.2", features = ["naga-ext"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
