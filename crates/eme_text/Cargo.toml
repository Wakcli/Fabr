[package]
name = "eme_text"
version = "0.20.0-dev"
edition = "2024"
description = "Provides text functionality for Eme Engine"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme"]

[features]
default_font = []
system_font_discovery = ["parley/system"]
system_clipboard = ["eme_clipboard/system_clipboard"]
complex_script_segmentation = ["parley/complex-scripts"]

[dependencies]
# eme
eme_app = { path = "../eme_app", version = "0.20.0-dev" }
eme_asset = { path = "../eme_asset", version = "0.20.0-dev" }
eme_clipboard = { path = "../eme_clipboard", version = "0.20.0-dev", default-features = false }
eme_color = { path = "../eme_color", version = "0.20.0-dev" }
eme_derive = { path = "../eme_derive", version = "0.20.0-dev" }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev" }
eme_image = { path = "../eme_image", version = "0.20.0-dev" }
eme_log = { path = "../eme_log", version = "0.20.0-dev" }
eme_math = { path = "../eme_math", version = "0.20.0-dev" }
eme_reflect = { path = "../eme_reflect", version = "0.20.0-dev", features = [
  "smol_str",
] }
eme_utils = { path = "../eme_utils", version = "0.20.0-dev" }
eme_platform = { path = "../eme_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
  "serialize",
] }

# other
wgpu-types = { version = "30", default-features = false }
thiserror = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
smallvec = { version = "1", default-features = false }
smol_str = { version = "0.2", default-features = false }
sys-locale = "0.3.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
parley = { version = "0.11.0", default-features = false, features = ["std"] }
swash = { version = "0.2.6" }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
