[package]
name = "eme_time"
version = "0.20.0-dev"
edition = "2024"
description = "Provides time functionality for Eme Engine"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme"]

[features]
default = ["std", "eme_reflect", "eme_app/default"]

# Functionality

## Adds runtime reflection support using `eme_reflect`.
eme_reflect = [
  "dep:eme_reflect",
  "eme_ecs/eme_reflect",
  "eme_app/eme_reflect",
]

## Adds serialization support through `serde`.
serialize = ["dep:serde", "eme_ecs/serialize", "eme_platform/serialize"]

# Platform Compatibility

## Allows access to the `std` crate. Enabling this feature will prevent compilation
## on `no_std` targets, but provides access to certain additional features on
## supported platforms.
std = [
  "serde?/std",
  "eme_reflect?/std",
  "eme_ecs/std",
  "eme_app/std",
  "eme_platform/std",
  "dep:crossbeam-channel",
]

## `critical-section` provides the building blocks for synchronization primitives
## on all platforms, including `no_std`.
critical-section = [
  "eme_ecs/critical-section",
  "eme_platform/critical-section",
  "eme_reflect?/critical-section",
  "eme_app/critical-section",
]

[dependencies]
# eme
eme_app = { path = "../eme_app", version = "0.20.0-dev", default-features = false }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev", default-features = false }
eme_reflect = { path = "../eme_reflect", version = "0.20.0-dev", default-features = false, optional = true }
eme_platform = { path = "../eme_platform", version = "0.20.0-dev", default-features = false }

# other
crossbeam-channel = { version = "0.5.0", default-features = false, features = [
  "std",
], optional = true }
serde = { version = "1", features = [
  "derive",
], default-features = false, optional = true }
log = { version = "0.4", default-features = false }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
