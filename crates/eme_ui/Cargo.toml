[package]
name = "eme_ui"
version = "0.20.0-dev"
edition = "2024"
description = "A custom ECS-driven UI framework built specifically for Eme Engine"
homepage = "https://eme.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme"]

[dependencies]
# eme
eme_a11y = { path = "../eme_a11y", version = "0.20.0-dev" }
eme_app = { path = "../eme_app", version = "0.20.0-dev" }
eme_asset = { path = "../eme_asset", version = "0.20.0-dev" }
eme_camera = { path = "../eme_camera", version = "0.20.0-dev" }
eme_color = { path = "../eme_color", version = "0.20.0-dev" }
eme_derive = { path = "../eme_derive", version = "0.20.0-dev" }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev" }
eme_image = { path = "../eme_image", version = "0.20.0-dev" }
eme_input = { path = "../eme_input", version = "0.20.0-dev" }
eme_input_focus = { path = "../eme_input_focus", version = "0.20.0-dev" }
eme_math = { path = "../eme_math", version = "0.20.0-dev" }
eme_log = { path = "../eme_log", version = "0.20.0-dev" }
eme_reflect = { path = "../eme_reflect", version = "0.20.0-dev" }
eme_sprite = { path = "../eme_sprite", version = "0.20.0-dev", features = [
  "eme_text",
] }
eme_time = { path = "../eme_time", version = "0.20.0-dev" }
eme_text = { path = "../eme_text", version = "0.20.0-dev" }
eme_picking = { path = "../eme_picking", version = "0.20.0-dev", optional = true }
eme_transform = { path = "../eme_transform", version = "0.20.0-dev" }
eme_window = { path = "../eme_window", version = "0.20.0-dev" }
eme_utils = { path = "../eme_utils", version = "0.20.0-dev" }
eme_platform = { path = "../eme_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
] }

# other
taffy = { version = "0.14", default-features = false, features = [
  "std",
  "block_layout",
  "flexbox",
  "grid",
  "content_size",
  "taffy_tree",
] }
serde = { version = "1", features = ["derive"], optional = true }
uuid = { version = "1.21.0", features = ["v4"], optional = true }
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = ["from"] }
smallvec = { version = "1", default-features = false }
accesskit = "0.24"
parley = { version = "0.11.0", default-features = false, features = ["std"] }
swash = { version = "0.2.6" }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
eme_core_pipeline = { path = "../eme_core_pipeline", version = "0.20.0-dev" }

[features]
default = []
serialize = [
  "serde",
  "smallvec/serde",
  "eme_math/serialize",
  "eme_platform/serialize",
]
eme_picking = ["dep:eme_picking", "dep:uuid"]

# Experimental features
ghost_nodes = []

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
