[package]
name = "eme_ui_render"
version = "0.20.0-dev"
edition = "2024"
description = "Provides rendering functionality for Eme UI"
homepage = "https://bevyengine.org"
repository = "https://github.com/bevyengine/eme"
license = "MIT OR Apache-2.0"
keywords = ["eme"]

[dependencies]
# eme
eme_app = { path = "../eme_app", version = "0.20.0-dev" }
eme_asset = { path = "../eme_asset", version = "0.20.0-dev" }
eme_camera = { path = "../eme_camera", version = "0.20.0-dev" }
eme_color = { path = "../eme_color", version = "0.20.0-dev" }
eme_core_pipeline = { path = "../eme_core_pipeline", version = "0.20.0-dev" }
eme_derive = { path = "../eme_derive", version = "0.20.0-dev" }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev" }
eme_extract = { path = "../eme_extract", version = "0.20.0-dev" }
eme_image = { path = "../eme_image", version = "0.20.0-dev" }
eme_input_focus = { path = "../eme_input_focus", version = "0.20.0-dev" }
eme_math = { path = "../eme_math", version = "0.20.0-dev" }
eme_mesh = { path = "../eme_mesh", version = "0.20.0-dev" }
eme_reflect = { path = "../eme_reflect", version = "0.20.0-dev" }
eme_shader = { path = "../eme_shader", version = "0.20.0-dev" }
eme_render = { path = "../eme_render", version = "0.20.0-dev" }
eme_sprite = { path = "../eme_sprite", version = "0.20.0-dev" }
eme_sprite_render = { path = "../eme_sprite_render", version = "0.20.0-dev", features = [
  "eme_text",
] }
eme_transform = { path = "../eme_transform", version = "0.20.0-dev" }
eme_utils = { path = "../eme_utils", version = "0.20.0-dev" }
eme_platform = { path = "../eme_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
] }
eme_ui = { path = "../eme_ui", version = "0.20.0-dev" }
eme_text = { path = "../eme_text", version = "0.20.0-dev" }
eme_a11y = { path = "../eme_a11y", version = "0.20.0-dev" }

# other
bytemuck = { version = "1.5", features = ["derive"] }
derive_more = { version = "2", default-features = false, features = ["from"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
indexmap = { version = "2" }
smallvec = { version = "1", default-features = false }

[features]
default = ["eme_ui_debug"]
serialize = ["eme_math/serialize", "eme_platform/serialize"]
eme_ui_debug = []

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
