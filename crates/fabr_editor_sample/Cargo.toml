[package]
name = "fabr_editor_sample"
version = "0.20.0-dev"
edition = "2024"
description = "Example editor extension plugin: panel, Inspector field and importer"
license = "MIT OR Apache-2.0"
rust-version = "1.96.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
fabr = { path = "../fabr", version = "0.20.0-dev", features = ["dynamic_linking"] }
eme_ecs = { path = "../eme_ecs", version = "0.20.0-dev" }
eme_game_scene = { path = "../eme_game_scene", version = "0.20.0-dev" }

[lints]
workspace = true
