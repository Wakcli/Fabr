[package]
name = "mipmap_generator"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
eme = { path = "../../../", default-features = false, features = [
  "eme_asset",
  "eme_world_serialization",
  "eme_pbr",
  "ktx2",
  "jpeg",
  "multi_threaded",
] }
image = { version = "0.25.2", default-features = false }
fast_image_resize = { version = "6.0", features = ["image"] }
futures-lite = "2.0.1"
tracing = "0.1"
intel_tex_2 = { version = "0.5.0", optional = true }
zstd = { version = "0.13.2", optional = true }

[dev-dependencies]
eme = { path = "../../../" }
argh = "0.1.12"

[features]
default = ["debug_text", "eme_zstd_rust"]
compress = ["dep:intel_tex_2", "dep:zstd"]
debug_text = ["eme/eme_ui"]
pbr_transmission_textures = ["eme/pbr_transmission_textures"]
pbr_multi_layer_material_textures = ["eme/pbr_multi_layer_material_textures"]
pbr_anisotropy_texture = ["eme/pbr_anisotropy_texture"]
pbr_specular_textures = ["eme/pbr_specular_textures"]
eme_zstd_rust = ["eme/zstd_rust"]
eme_zstd_c = ["eme/zstd_c"]
