[package]
name = "eme_mobile_example"
# Version is required by `cargo-apk`, though this value will never change.
version = "0.0.0"
edition = "2024"
description = "Example for building an iOS or Android app with Eme"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "eme_mobile_example"
crate-type = ["lib", "cdylib"]

[dependencies]
eme = { path = "../../", features = ["android-game-activity"] }

[lints]
workspace = true
